[package]
name = "noesis"
version = "0.1.0"
edition = "2024"
description = "Typed binary agent harness — capnp RPC replacing MCP JSON-RPC"
authors = ["Li Goldragon <li@goldragon.criome.net>"]

[[bin]]
name = "noesis"
path = "src/main.rs"

[dependencies]
lojix-macros = { path = "../lojix/lojix-macros" }
criome-cozo = { path = "../criome-cozo" }
samskara-core = { path = "../samskara-core" }
samskara-codegen = { path = "../samskara-codegen" }
capnp = "0.21"
capnp-rpc = "0.21"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
blake3 = "1.8"

[build-dependencies]
criome-cozo = { path = "../criome-cozo" }
samskara-core = { path = "../samskara-core" }
samskara-codegen = { path = "../samskara-codegen" }
capnpc = "0.21"
