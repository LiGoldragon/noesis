[workspace]
members = [".", "flake-crates/lojix-macros"]

[workspace.dependencies]
criome-cozo = { path = "flake-crates/criome-cozo" }
samskara-core = { path = "flake-crates/samskara-core" }
samskara-codegen = { path = "flake-crates/samskara-codegen" }

[package]
name = "noesis"
version = "0.1.0"
edition = "2024"
description = "Typed binary agent harness — capnp RPC replacing MCP JSON-RPC"
authors = ["Li Goldragon <li@goldragon.criome.net>"]

[[bin]]
name = "noesis"
path = "src/main.rs"

[dependencies]
lojix-macros = { path = "flake-crates/lojix-macros" }
criome-cozo = { workspace = true }
samskara-core = { workspace = true }
samskara-codegen = { workspace = true }
capnp = "0.21"
capnp-rpc = "0.21"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
blake3 = "1.8"

[build-dependencies]
criome-cozo = { workspace = true }
samskara-core = { workspace = true }
samskara-codegen = { workspace = true }
capnpc = "0.21"
